      padding: 12px 14px 28px;
      box-shadow: 0 12px 36px rgba(15, 23, 42, .18);
    }
    .drawer-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 2px 4px 10px; margin-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }
    .drawer-title { font-size: 13.5px; font-weight: 650; color: var(--text); }
    .icon-btn {
      appearance: none; border: 1px solid var(--line); border-radius: 6px;
      background: var(--surface); color: var(--text-2);
      width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  }

  @supports (animation-timeline: scroll()) {
    @media (max-width: 859px) {
      .doc-sidebar[popover] {
        timeline-scope: --drawer-fade;
        animation: fade-drawer-backdrop linear both;
        animation-timeline: --drawer-fade;
      }
      .drawer-scroller {
        scroll-timeline: --drawer-fade x;
      }
      @property --drawer-backdrop {
        syntax: '<number>';
        inherits: true;
        initial-value: 0;
      }
      @keyframes fade-drawer-backdrop {
        0% { --drawer-backdrop: 1; }
        100% { --drawer-backdrop: 0; }
      }
    }
  }

  @media (max-width: 599px) {
    .search-trigger { min-width: 0; }
    .search-trigger-text, .search-kbd { display: none; }
    .search-trigger-short { display: block; }
    .search-hints { display: none; }
  }

  @media print {
    .topbar, .doc-sidebar, .toc-col, .mobile-toc, .doc-actions, .doc-pager, .footer, .toast, #search-dialog { display: none !important; }
    body { background: #fff; }
    .shell { display: block; padding: 0; }
    .doc-body, .doc-head { box-shadow: none; border: 0; padding: 0; }
    .panel { display: block !important; }
    .doc-head { margin-bottom: 12px; }
  }
</style>
</head>

<!--__DOC_DATA__-->
<!--__ASSET_DATA__-->
<script>
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("doc-data").textContent);
  var ASSETS = JSON.parse(document.getElementById("asset-data").textContent);
  var DOCS = DATA.docs;
  var DOC_BY_PATH = {};
  var DOC_BY_ID = {};
  DOCS.forEach(function (d) {
    DOC_BY_PATH[d.file] = d.id;
    DOC_BY_ID[d.id] = d;
  });

  var GROUP_META = Array.isArray(DATA.groups) && DATA.groups.length ? DATA.groups : [];
  var GROUP_LABEL_MAP = {};
  var GROUPS = [];
  var seenDocs = {};
  function groupKeyOf(dir) { return dir === "" ? "_root" : String(dir).replace(/[^a-zA-Z0-9_-]/g, "_"); }
  GROUP_META.forEach(function (meta) {
    var key = groupKeyOf(meta.dir);
    GROUP_LABEL_MAP[key] = meta.label;
    var items = DOCS.filter(function (d) {
      if (d.dir === meta.dir) { seenDocs[d.id] = true; return true; }
      return false;
    });
    if (items.length) GROUPS.push({ dir: key, label: meta.label, docs: items });
  });
  var extraByKey = {};
  var extraKeys = [];
  DOCS.forEach(function (d) {
    if (seenDocs[d.id]) return;
    var key = d.dir ? groupKeyOf(d.dir) : "other";
    if (!extraByKey[key]) {
      extraByKey[key] = [];
      extraKeys.push({ key: key, label: d.dir || "其他文档" });
    }
    extraByKey[key].push(d);
  });
  extraKeys.forEach(function (entry) {
    GROUP_LABEL_MAP[entry.key] = entry.label;
    GROUPS.push({ dir: entry.key, label: entry.label, docs: extraByKey[entry.key] });
  });

  var ORDERED_DOCS = [];
  var GROUP_BY_DOC_ID = {};
  GROUPS.forEach(function (g) {
    g.docs.forEach(function (d) {
      ORDERED_DOCS.push(d);
      GROUP_BY_DOC_ID[d.id] = g.dir;
    });
  });

  /* ---------- helpers ---------- */
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function resolvePath(dir, href) {
    var parts = (dir ? dir.split("/") : []).concat(href.split("/"));
    var out = [];
    parts.forEach(function (p) {
      if (!p || p === ".") return;
      if (p === "..") out.pop(); else out.push(p);
    });
    return out.join("/");
  }
  function indentOf(line) { return (line.match(/^\s*/) || [""])[0].length; }
  function isBlank(line) { return !line || !line.trim(); }
  function isFence(line) { return /^\s*```/.test(line); }
  function isHeading(line) { return /^#{1,6}\s+/.test(line); }
  function isListLine(line) { return /^\s*(?:[-*+]|\d+\.)\s+/.test(line); }
  function isHr(line) { return /^\s*([-*_])\s*(?:\1\s*){2,}$/.test(line); }
  function isQuote(line) { return /^\s*>\s?/.test(line); }
  function isTableSep(line) {
    return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(line);
  }
  function isTableStart(lines, i) {
    return /^\s*\|/.test(lines[i] || "") && isTableSep(lines[i + 1] || "");
  }
  function isBlockStart(lines, i) {
    var line = lines[i] || "";
    return isFence(line) || isHeading(line) || isListLine(line) || isQuote(line) ||
      isHr(line) || isTableStart(lines, i);
  }

  /* ---------- inline ---------- */
  function inline(text, ctx) {
    var s = esc(text);
    var codes = [];
    s = s.replace(/`([^`]+)`/g, function (_, code) {
      codes.push(code);
      return "\u0000C" + (codes.length - 1) + "\u0000";
    });
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (_, alt, src) {
      var rel = /^https?:|^data:/.test(src) ? src : resolvePath(ctx.dir, src);
      var data = ASSETS[rel] || src;
      return '<img alt="' + alt + '" src="' + data + '">';
    });
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, label, href) {
      if (/^https?:/.test(href)) {
        return '<a href="' + href + '" target="_blank" rel="noreferrer noopener">' + label + "</a>";
      }
      var rel = resolvePath(ctx.dir, href);
      var parts = rel.split("#");
      var target = parts[0];
      var hash = parts[1] ? "#" + parts[1] : "";
      if (DOC_BY_PATH[target]) {
        var targetId = DOC_BY_PATH[target];
        return '<a href="#' + targetId + '" data-doc="' + targetId + '">' + label + "</a>";
      }
      return '<a href="' + rel + hash + '">' + label + "</a>";
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\u0000C(\d+)\u0000/g, function (_, idx) {
      return "<code>" + esc(codes[+idx]) + "</code>";
    });
    return s;
  }

  /* ---------- block parsing ---------- */
  function parseBlocks(lines, start, end, ctx) {
    var out = [];
    var i = start;
    while (i < end) {
      var line = lines[i];
      if (isBlank(line)) { i++; continue; }
      if (isFence(line)) {
        var code = [];
        i++;
        while (i < end && !/^\s*```/.test(lines[i])) { code.push(lines[i]); i++; }
        i++;
        out.push('<pre class="code"><code>' + esc(code.join("\n")) + "</code></pre>");
        continue;
      }
      if (isHeading(line)) {
        var m = line.match(/^(#{1,6})\s+(.*)$/);
        var level = m[1].length;
        var text = m[2].replace(/\s+#+\s*$/, "");
        ctx.hIndex = (ctx.hIndex || 0) + 1;
        var shortId = "h-" + ctx.hIndex + "-" + level;
        var domId = ctx.docId + "--" + shortId;
        out.push(
          "<h" + level + ' id="' + domId + '" data-hid="' + shortId + '" tabindex="-1">' +
          inline(text, ctx) + "</h" + level + ">"
        );
        i++;
        continue;
      }
      if (isTableStart(lines, i)) {
        var table = [];
        var header = lines[i];
        var sep = lines[i + 1];
        i += 2;
        while (i < end && /^\s*\|/.test(lines[i])) { table.push(lines[i]); i++; }
        out.push(renderTable(header, sep, table, ctx));
        continue;
      }
      if (isListLine(line)) {
        var list = parseList(lines, i, end, ctx);
        out.push(list.html);
        i = list.next;
        continue;
      }
      if (isQuote(line)) {
        var quote = [];
        while (i < end && isQuote(lines[i])) {
          quote.push(lines[i].replace(/^\s*>\s?/, ""));
          i++;
        }
        out.push("<blockquote><p>" + inline(quote.join(" "), ctx) + "</p></blockquote>");
        continue;
      }
      if (isHr(line)) { out.push("<hr>"); i++; continue; }

      var para = [];
      while (i < end && !isBlank(lines[i]) && !isBlockStart(lines, i)) {
        para.push(lines[i].trim());
        i++;
      }
      if (para.length) out.push("<p>" + inline(para.join(" "), ctx) + "</p>");
    }
    return out.join("\n");
  }

  function splitRow(row) {
    var s = row.trim();
    if (s.charAt(0) === "|") s = s.slice(1);
    if (s.charAt(s.length - 1) === "|") s = s.slice(0, -1);
    return s.replace(/\\\|/g, "\u0000P\u0000").split("|").map(function (c) {
      return c.replace(/\u0000P\u0000/g, "|").trim();
    });
  }

  function renderTable(header, sep, rows, ctx) {
    var head = splitRow(header);
    var aligns = splitRow(sep).map(function (c) {
      var l = c.charAt(0) === ":";
      var r = c.charAt(c.length - 1) === ":";
      return l && r ? "center" : r ? "right" : l ? "left" : "";
    });
    var html = ["<table><thead><tr>"];
    head.forEach(function (cell, idx) {
      var a = aligns[idx] ? ' style="text-align:' + aligns[idx] + '"' : "";
      html.push("<th" + a + ">" + inline(cell, ctx) + "</th>");
    });
    html.push("</tr></thead><tbody>");
    rows.forEach(function (row) {
      html.push("<tr>");
      var cells = splitRow(row);
      for (var c = 0; c < head.length; c++) {
        var a = aligns[c] ? ' style="text-align:' + aligns[c] + '"' : "";
        html.push("<td" + a + ">" + inline(cells[c] || "", ctx) + "</td>");
      }
      html.push("</tr>");
    });
    html.push("</tbody></table></div>");
    return '<div class="table-wrap">' + html.join("");
  }

  function parseList(lines, start, end, ctx) {
    var first = lines[start];
    var baseIndent = indentOf(first);
    var ordered = /^\s*\d+\.\s+/.test(first);
    var tag = ordered ? "ol" : "ul";
    var items = [];
    var i = start;

    while (i < end) {
      if (isBlank(lines[i])) {
        var j = i + 1;
        while (j < end && isBlank(lines[j])) j++;
        if (j < end && indentOf(lines[j]) > baseIndent && isListLine(lines[j])) { i = j; continue; }
        break;
      }
      if (indentOf(lines[i]) !== baseIndent) break;
      var isOrdered = /^\s*\d+\.\s+/.test(lines[i]);
      var isBullet = /^\s*[-*+]\s+/.test(lines[i]);
      if (!isListLine(lines[i]) || isOrdered !== ordered || (!isOrdered && !isBullet)) break;

      var text = lines[i].replace(/^\s*(?:[-*+]|\d+\.)\s+/, "");
      var content = [text];
      i++;

      while (i < end) {
        if (isBlank(lines[i])) {
          var k = i + 1;
          while (k < end && isBlank(lines[k])) k++;
          if (k < end && indentOf(lines[k]) > baseIndent) { content.push(""); i++; continue; }
          break;
        }
        if (indentOf(lines[i]) > baseIndent) { content.push(lines[i]); i++; continue; }
        break;
      }

      var dedented = dedent(content);
      var inner = parseBlocks(dedented, 0, dedented.length, ctx);
      if (/^<p>[\s\S]*<\/p>$/.test(inner)) {
        items.push("<li>" + inner.slice(3, -4) + "</li>");
      } else {
        items.push("<li>" + inner + "</li>");
      }
    }

    return { html: "<" + tag + ">" + items.join("") + "</" + tag + ">", next: i };
  }

  function dedent(lines) {
    var min = Infinity;
    lines.forEach(function (line, idx) {
      if (idx === 0 || isBlank(line)) return;
      min = Math.min(min, indentOf(line));
    });
    if (!isFinite(min) || min === 0) return lines.slice();
    return lines.map(function (line, idx) {
      return idx === 0 || isBlank(line) ? line : line.slice(min);
    });
  }

  /* ---------- DOM refs ---------- */
  var navGroupsEl = document.getElementById("nav-groups");
  var panelsEl = document.getElementById("panels");
  var tocColEl = document.getElementById("toc-col");
  var tocList = document.getElementById("toc-list");
  var mobileTocEl = document.getElementById("mobile-toc");
  var mobileTocToggle = document.getElementById("mobile-toc-toggle");
  var mobileTocCurrent = document.getElementById("mobile-toc-current");
  var mobileTocList = document.getElementById("mobile-toc-list");
  var brandLink = document.getElementById("brand-link");
  if (ORDERED_DOCS.length && brandLink) {
    brandLink.href = "#" + ORDERED_DOCS[0].id;
    brandLink.setAttribute("data-doc", ORDERED_DOCS[0].id);
  }

  /* ---------- render grouped sidebar & panels ---------- */
  GROUPS.forEach(function (group) {
    var wrap = document.createElement("div");
    wrap.className = "nav-group";
    wrap.setAttribute("data-group", group.dir);

    var listId = "nav-list-" + group.dir;
    var toggle = document.createElement("button");
    toggle.className = "nav-group-toggle";
    toggle.type = "button";
    toggle.setAttribute("aria-expanded", "true");
    toggle.setAttribute("aria-controls", listId);
    toggle.innerHTML =
      '<span class="nav-group-label">' +
      '<svg class="nav-chevron" width="14" height="14" aria-hidden="true"><use href="#ico-chevron"></use></svg>' +
      "<span>" + esc(group.label) + "</span>" +
      "</span>" +
      '<span class="nav-group-count">' + group.docs.length + "</span>";

    var ul = document.createElement("ul");
    ul.className = "nav-list";
    ul.id = listId;

    group.docs.forEach(function (doc) {
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.className = "nav-link";
      a.id = "nav-" + doc.id;
      a.href = "#" + doc.id;
      a.setAttribute("data-doc", doc.id);
      a.title = doc.title;
      a.innerHTML = '<span class="nav-link-text">' + esc(doc.label) + "</span>";
      li.appendChild(a);
      ul.appendChild(li);
    });

    toggle.addEventListener("click", function () {
      var expanded = toggle.getAttribute("aria-expanded") === "true";
      toggle.setAttribute("aria-expanded", expanded ? "false" : "true");
      ul.hidden = expanded;
    });

    wrap.appendChild(toggle);
    wrap.appendChild(ul);
    navGroupsEl.appendChild(wrap);
  });

  ORDERED_DOCS.forEach(function (doc, idx) {
    var groupLabel = GROUP_LABEL_MAP[GROUP_BY_DOC_ID[doc.id]] || "文档";
    var prev = idx > 0 ? ORDERED_DOCS[idx - 1] : null;
    var next = idx < ORDERED_DOCS.length - 1 ? ORDERED_DOCS[idx + 1] : null;

    var pagerHtml = '<nav class="doc-pager" aria-label="相邻文档">';
    if (prev) {
      pagerHtml +=
        '<a class="pager-link prev" href="#' + prev.id + '" data-doc="' + prev.id + '">' +
        '<span class="pager-dir"><svg width="13" height="13" aria-hidden="true"><use href="#ico-arrow-left"></use></svg><span>上一篇</span></span>' +
        '<span class="pager-title">' + esc(prev.label) + "</span>" +
        "</a>";
    } else {
      pagerHtml += '<span class="pager-spacer" aria-hidden="true"></span>';
    }
    if (next) {
      pagerHtml +=
        '<a class="pager-link next" href="#' + next.id + '" data-doc="' + next.id + '">' +
        '<span class="pager-dir"><span>下一篇</span><svg width="13" height="13" aria-hidden="true"><use href="#ico-arrow-right"></use></svg></span>' +

      while (idx < lower.length) {

        idx = found + term.length;

    if (!ranges.length) return esc(text);
    ranges.sort(function (a, b) { return a[0] - b[0] || b[1] - a[1]; });

    for (var i = 1; i < ranges.length; i++) {

    var out = [];
    var cursor = 0;
    merged.forEach(function (r) {
      if (r[0] > cursor) out.push(esc(text.slice(cursor, r[0])));

        if (containsAllTerms(sec.headingLower, terms)) {

          if (sec.headingLower.indexOf(q) !== -1) sScore += 45;
        }
        if (containsAllTerms(sec.textLower, terms)) {

          shortId: sec.shortId,

        '<button type="button" class="search-item" role="option" id="sr-' + i + '" aria-selected="false" data-hit="' + i + '">' +
        '<div class="search-item-top">' +
        '<span class="search-item-title">' + hit.titleHtml + "</span>" +
        '<span class="search-item-doc">' + esc(hit.metaText) + "</span>" +
        "</div>" +
        '<div class="search-item-snippet">' + hit.snippetHtml + "</div>" +
        "</button>"
      );
    });
    searchResultsEl.innerHTML = rowsHtml.join("");
    searchStatusEl.textContent = totalCount > visible.length
      ? "显示前 " + visible.length + " 条（共 " + totalCount + " 条匹配）"
      : "共 " + totalCount + " 条匹配";
    setSelectedResult(0);
  }

  function selectSearchHit(idx) {
    var hit = activeHits[idx];
    if (!hit) return;
    searchDialog.close();
    activate(hit.docId, { push: true, targetId: hit.shortId, flash: !!hit.shortId });
  }

  function openSearch() {
    if (isDrawerActive()) closeDrawer();
    if (!searchDialog.open) {
      renderSearch(searchInput.value);
      searchDialog.showModal();
    }
    searchInput.focus();
    searchInput.select();
  }

  searchOpenBtn.addEventListener("click", openSearch);
  searchCloseBtn.addEventListener("click", function () { searchDialog.close(); });
  searchInput.addEventListener("input", function () { renderSearch(searchInput.value); });
  searchResultsEl.addEventListener("click", function (event) {
    var item = event.target.closest(".search-item[data-hit]");
    if (!item) return;
    selectSearchHit(+item.getAttribute("data-hit"));
  });

  searchDialog.addEventListener("keydown", function (event) {
    if (event.isComposing || event.keyCode === 229) return;
    if (event.key === "ArrowDown") {
      event.preventDefault();
      setSelectedResult(activeResultIdx + 1);
    } else if (event.key === "ArrowUp") {
      event.preventDefault();
      setSelectedResult(activeResultIdx - 1);
    } else if (event.key === "Enter" && activeResultIdx >= 0) {
      event.preventDefault();
      selectSearchHit(activeResultIdx);
    }
  });

  if (!("closedBy" in HTMLDialogElement.prototype)) {
    var pressedOutside = false;
    function isOutsideDialog(e) {
      var r = searchDialog.getBoundingClientRect();
      return e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom;
    }
    searchDialog.addEventListener("pointerdown", function (e) { pressedOutside = isOutsideDialog(e); });
    searchDialog.addEventListener("pointerup", function (e) {
      if (pressedOutside && isOutsideDialog(e)) searchDialog.close();
    });
  }

  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
      e.preventDefault();
      if (searchDialog.open) searchDialog.close();
      else openSearch();
      return;
    }
    if (e.key === "Escape" && isDrawerActive() && !searchDialog.open) {
      e.preventDefault();
      closeDrawer();
      return;
    }
    if (e.key === "/" && !e.metaKey && !e.ctrlKey && !e.altKey && !searchDialog.open) {
      var t = e.target;
      var isEditable = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable);
      if (!isEditable) {
        e.preventDefault();
        openSearch();
      }
    }
  });

  /* ---------- toast ---------- */
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1800);
  }

  /* ---------- initial load ---------- */
  var init = parseHash();
  var initDoc = DOC_BY_ID[init.docId];
  activate(initDoc ? initDoc.id : ORDERED_DOCS[0].id, {
    push: false,
    replace: !initDoc,
    targetId: initDoc ? init.headingId : null,
    instant: true
  });
})();
</script>
</body>
</html>
